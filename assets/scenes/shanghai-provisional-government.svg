<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 230" width="480" height="230" role="img" aria-label="임시헌장 문서, 국민 주권, 민주공화제 현판">
<defs>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ece3cf"/><stop offset="1" stop-color="#e0d4b8"/></linearGradient>
<filter id="paper" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="4" result="n"/><feColorMatrix in="n" type="matrix" values="0 0 0 0 0.45  0 0 0 0 0.36  0 0 0 0 0.25  0 0 0 0.16 0"/><feComposite in2="SourceGraphic" operator="in"/></filter>
<filter id="wash"><feTurbulence type="fractalNoise" baseFrequency="0.03 0.08" numOctaves="3" seed="7" result="t"/><feDisplacementMap in="SourceGraphic" in2="t" scale="6"/></filter>
<linearGradient id="sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5c8190"/><stop offset="1" stop-color="#3f6577"/></linearGradient>
</defs>
<rect width="480" height="230" fill="url(#sky)"/>
<rect y="170" width="480" height="60" fill="#8a6f4e"/><path d="M0 170 H480" stroke="#2a1d14" opacity=".5"/>
<g transform="translate(115 67) scale(1.2)" stroke="#2a1d14" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"><rect x="-26" y="-14" width="52" height="28" fill="#f3ead2"/><rect x="-30" y="-17" width="8" height="34" rx="3" fill="#8a5a35"/><rect x="22" y="-17" width="8" height="34" rx="3" fill="#8a5a35"/><path d="M-16 -4 H16 M-16 4 H16" stroke-width="1"/></g>
<g transform="translate(240 111) scale(1.1)" stroke="#2a1d14" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"><rect x="-34" y="-14" width="68" height="28" fill="#2f3b34"/><rect x="-34" y="-14" width="68" height="28" fill="none" stroke="#b08a3e" stroke-width="2.4"/><text x="0" y="6" font-size="17" text-anchor="middle" stroke="none" fill="#e7c872" font-family="Noto Serif KR,Batang,serif">主權</text></g>
<g transform="translate(365 67) scale(1.1)" stroke="#2a1d14" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"><rect x="-34" y="-14" width="68" height="28" fill="#2f3b34"/><rect x="-34" y="-14" width="68" height="28" fill="none" stroke="#b08a3e" stroke-width="2.4"/><text x="0" y="6" font-size="17" text-anchor="middle" stroke="none" fill="#e7c872" font-family="Noto Serif KR,Batang,serif">共和</text></g>
<rect width="480" height="230" fill="#fff" filter="url(#paper)"/>
</svg>
