<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 230" width="480" height="230" role="img" aria-label="정책 문서, 동원 장부, 한글 책">
<defs>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ece3cf"/><stop offset="1" stop-color="#e0d4b8"/></linearGradient>
<filter id="paper" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="4" result="n"/><feColorMatrix in="n" type="matrix" values="0 0 0 0 0.45  0 0 0 0 0.36  0 0 0 0 0.25  0 0 0 0.16 0"/><feComposite in2="SourceGraphic" operator="in"/></filter>
<filter id="wash"><feTurbulence type="fractalNoise" baseFrequency="0.03 0.08" numOctaves="3" seed="7" result="t"/><feDisplacementMap in="SourceGraphic" in2="t" scale="6"/></filter>
<linearGradient id="sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5c8190"/><stop offset="1" stop-color="#3f6577"/></linearGradient>
</defs>
<rect width="480" height="230" fill="url(#sky)"/>
<rect y="170" width="480" height="60" fill="#8a6f4e"/><path d="M0 170 H480" stroke="#2a1d14" opacity=".5"/>
<g transform="translate(106 80) scale(1.2)" stroke="#2a1d14" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"><rect x="-26" y="-14" width="52" height="28" fill="#f3ead2"/><rect x="-30" y="-17" width="8" height="34" rx="3" fill="#8a5a35"/><rect x="22" y="-17" width="8" height="34" rx="3" fill="#8a5a35"/><path d="M-16 -4 H16 M-16 4 H16" stroke-width="1"/></g>
<g transform="translate(240 112) scale(1.2)" stroke="#2a1d14" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"><rect x="-26" y="-14" width="22" height="28" fill="#e8dcba"/><rect x="2" y="-14" width="22" height="28" fill="#d9c8a0"/><path d="M-22 -6 H-8 M-22 2 H-8 M6 -6 H20 M6 2 H20" stroke-width="1"/></g>
<g transform="translate(374 80) scale(1.2)" stroke="#2a1d14" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"><rect x="-20" y="-16" width="40" height="32" rx="2" fill="#e8dcba"/><path d="M-20 -16 H-16 V16 H-20" fill="#8c3b26"/><path d="M-8 -6 H12 M-8 2 H12 M-8 10 H4" stroke-width="1"/><text x="2" y="-8" font-size="9" text-anchor="middle" stroke="none" fill="#2a1d14" font-family="Noto Serif KR,Batang,serif">한글</text></g>
<rect width="480" height="230" fill="#fff" filter="url(#paper)"/>
</svg>
